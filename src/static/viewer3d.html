    tris = _select.brushTriangles(topo, face, [local.x, local.y, local.z],
                                  (_cutRadius * _modelSpan()) / scale);
  } else {
    tris = _select.withLabel(labels, face);
  }
  return { mesh, tris, material: (mesh.material || {}).name || '' };
}

// Размер модели в мире - мерило радиуса кисти: «5% модели» одинаково и на
// пистолете, и на пулемёте
let _spanOf = null;
function _modelSpan() {
  if (!_spanOf || _spanOf.model !== currentModel) {
    const size = new THREE.Box3().setFromObject(currentModel).getSize(new THREE.Vector3());
    _spanOf = { model: currentModel, span: Math.max(size.x, size.y, size.z) || 1 };
  }
  return _spanOf.span;
}

// add = true/false - добавить/убрать; null - переключить: всё уже выделено -
// убрать, иначе добавить. Так щелчок по выделенной детали снимает её
function _cutApply(mesh, tris, add) {
  if (!_cutSel || _cutSel.mesh !== mesh) {
    // Выделение - из одного материала: у другого своя развёртка и свои номера
    window.clearCutSelection();
    _cutSel = { mesh, material: (mesh.material || {}).name || '', tris: new Set(), overlay: null };
  }
  const sel = _cutSel.tris;
  const put = add === null ? !tris.every(t => sel.has(t)) : add;
  for (const t of tris) { if (put) sel.add(t); else sel.delete(t); }
  if (_cutSel.overlay) _dropOverlay(_cutSel.overlay);
  _cutSel.overlay = _trisOverlay(mesh, sel, 0x3ec7ff, 0.6);
  _tellCutSelection();
}

function _hoverCut(ndc) {
  if (_cutPaint) return;
  const found = _cutTarget(ndc);
  _clearCutHover();
  if (found) _cutHover = _trisOverlay(found.mesh, found.tris, 0xffb347, 0.45);
}

function _clearCutHover() {
  if (_cutHover) _dropOverlay(_cutHover);
  _cutHover = null;
}

function _cutClick(e) {
  const found = _cutTarget(_ndcFromEvent(e));
  if (found) _cutApply(found.mesh, found.tris, null);
  return !!found;
}

// Кисть ведут протяжкой. Перехватываем только нажатие НА модели: мимо неё
// протяжка по-прежнему крутит камеру
(function bindCutBrush() {
  const box = document.getElementById('canvas-container');
  box.addEventListener('pointerdown', e => {
    if (!_partsMode || !_cutMode || _cutTool !== 'brush' || e.button !== 0) return;
    const found = _cutTarget(_ndcFromEvent(e));
    if (!found) return;
    e.stopPropagation();
    e.preventDefault();
    _cutPaint = true;
    box.setPointerCapture(e.pointerId);
    _clearCutHover();
    _cutApply(found.mesh, found.tris, !_cutErase);
  }, true);
  box.addEventListener('pointermove', e => {
    if (!_cutPaint) return;
    e.stopPropagation();
    const found = _cutTarget(_ndcFromEvent(e));
    if (found && _cutSel && found.mesh === _cutSel.mesh) {
      _cutApply(found.mesh, found.tris, !_cutErase);
    }
  }, true);
  const finish = e => {
    if (!_cutPaint) return;
    e.stopPropagation();
    _cutPaint = false;
    if (box.hasPointerCapture(e.pointerId)) box.releasePointerCapture(e.pointerId);
  };
  box.addEventListener('pointerup', finish, true);
  box.addEventListener('pointercancel', finish, true);
})();

// FOV-зум колесом (только скайбокс)
// Фон-кубмапа бесконечно далёкая: долли-зум OrbitControls для неё ничего не
// меняет, поэтому в режиме скайбокса колесо крутит угол обзора камеры
// (скролл вверх = приблизить). Вне режима - обычный зум OrbitControls
const SKY_FOV_MIN = 20;
const SKY_FOV_MAX = 110;
renderer.domElement.addEventListener('wheel', (e) => {
  if (!_isSkyboxMode) return;
  e.preventDefault();
  camera.fov = Math.min(SKY_FOV_MAX,
                Math.max(SKY_FOV_MIN, camera.fov + e.deltaY * 0.05));
  camera.updateProjectionMatrix();
}, { passive: false });

// Публичная функция: показывает скайбокс как фон сцены (режим «Скайбокс»).
// faces = {up|dn|lf|rt|ft|bk: dataURL}. Грани может НЕ ХВАТАТЬ: у sky_halloween
// и sky_harvest_01 в игре нет нижней текстуры вовсе (VMT есть, а VTF нет - на
// этих картах низ неба не виден). Такую грань закрываем ровным цветом, пустой
// src поднял бы onerror, и вместо неба показалась бы красная надпись
window.loadSkybox = function(faces) {
  const gen = ++_sceneGeneration;   // отменяет параллельные загрузки моделей
  _isCritHitMode     = false;
  _editableMeshNames = null;
  _isSkyboxMode      = true;
  controls.enableZoom = false;   // колесо теперь крутит FOV (см. wheel-listener)
  stopAnimation();
  _dropModel();
  setStatus(_t.loading, false, true);

  const imgs = new Array(SRC_FACE_MAP.length);
  // Ждём только те грани, которые вообще есть: считать до шести значило бы
  // ждать вечно, а пустой src - получить onerror на ровном месте
  const want = SRC_FACE_MAP.map(m => faces[m.src] || '');
  const need = want.filter(Boolean).length;
  if (!need) { setStatus(_t.error_sky, true); return; }
  let loaded = 0;
  let failed = false;
  SRC_FACE_MAP.forEach((m, slot) => {
    if (!want[slot]) return;
    const img = new Image();
    img.onload = () => {
      if (_sceneGeneration !== gen || failed) return;
      imgs[slot] = img;
      loaded += 1;
      if (loaded < need) return;
      const cube = buildSkyCube(imgs);
      _disposeSkybox();
      scene.background = cube;
      _skyboxTexture   = cube;
      hideStatus();
      requestRender();
    };
    img.onerror = () => {
      if (_sceneGeneration !== gen || failed) return;
      failed = true;
      _disposeSkybox();   // не оставляем прежнее небо под текстом ошибки
      setStatus(_t.error_sky, true);
    };
    img.src = want[slot];
  });
};

// Публичная функция: убирает фон-скайбокс (выход из режима «Скайбокс»)
window.clearSkybox = function() {
  ++_sceneGeneration;   // гасим летящие onload параллельного loadSkybox
  _exitSkyboxView();
};

// CritHIT scene

// Создаёт/пересоздаёт спрайт текстуры крита над головой
function _placeCritSprite(dataUrl, headTopWorldY) {
  if (_critSprite) { scene.remove(_critSprite); _critSprite = null; }
  if (!dataUrl) return;

  // Создаём спрайт сразу (без текстуры), чтобы позиция была заранее задана
  const mat    = new THREE.SpriteMaterial({ transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(0.55, 0.55, 1);
  sprite.position.set(0, headTopWorldY + 0.38, 0);
  scene.add(sprite);
  _critSprite = sprite;

  // Загружаем текстуру через хелпер с error callback
  // Масштаб всегда 1:1 - crit.vtf в игре 256×256 (квадратная)
  _loadTextureThen(dataUrl, tex => {
    if (_critSprite !== sprite) return;   // спрайт уже заменён
    mat.map = tex;
    mat.needsUpdate = true;
  });
}

// Применяет текстуру ко всем мешам группы (солдат или OBJ).
// Загружает через _loadTextureThen - безопасный error callback и правильный colorSpace
function _applyModelTexture(group, modelTexDataUrl) {
  if (!modelTexDataUrl) return;
  _loadTextureThen(modelTexDataUrl, tex => {
    group.traverse(child => {
      if (!child.isMesh) return;
      child.material = new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide });
      child.material.needsUpdate = true;
    });
  });
}

// Публичная функция: загружает сцену CritHIT (солдат + billboard текстуры).
// modelTexDataUrl - data URL текстуры самого персонажа (необязательно)
window.loadCritHitScene = function(critTexDataUrl, modelTexDataUrl) {
  ++_sceneGeneration;   // отменяет любой параллельный loadCritHitSceneWithModel
  _isCritHitMode = true;
  _lastCritTexUrl = critTexDataUrl || '';
  setStatus(_t.loading, false, true);
  stopAnimation();
  _exitSkyboxView();

  // Очищаем предыдущую сцену
  _dropModel();

  // Строим солдата
  const soldier  = buildSoldierGroup();
  // Солдат: y=0..88 -> центр cy=44, высота=88
  const solHeight = 88;
  const cy        = solHeight / 2;
  const scale     = 2.0 / solHeight;

  soldier.position.set(0, -cy * scale, 0);
  soldier.scale.setScalar(scale);
  scene.add(soldier);
  currentModel = soldier;

  // Накладываем текстуру персонажа (если есть)
  if (modelTexDataUrl) {
    _applyModelTexture(soldier, modelTexDataUrl);
  }

  // Камера: немного выше центра, достаточно далеко чтобы видеть и фигуру, и эффект
  const fovRad   = (camera.fov * Math.PI) / 180;
  const distance = 1.0 / Math.tan(fovRad / 2) * 2.5;
  camera.position.set(0, 0.4, distance);
  camera.lookAt(0, 0.35, 0);
  controls.target.set(0, 0.35, 0);
  controls.update();

  // Billboard над головой: макушка в мировых координатах = (solHeight - cy)*scale = 1.0
  const headTopWorld = (solHeight - cy) * scale; // ≈ 1.0
  _placeCritSprite(_lastCritTexUrl, headTopWorld);

  hideStatus();
};

// Публичная функция: CritHIT сцена с пользовательской OBJ-моделью.
// Принимает содержимое OBJ-файла + параметры центрирования (вычисленные в Python).
// modelTexDataUrl - data URL текстуры самого персонажа (необязательно)
window.loadCritHitSceneWithModel = function(objContent, critTexDataUrl, cx, cy, cz, scale, modelTexDataUrl) {
  const gen = ++_sceneGeneration;   // все предыдущие async-колбэки теперь устарели
  _isCritHitMode = true;
  _lastCritTexUrl = critTexDataUrl || '';
  setStatus(_t.loading, false, true);
  stopAnimation();
  _exitSkyboxView();

  _dropModel();

  const blob   = new Blob([objContent], { type: 'text/plain' });
  const objUrl = URL.createObjectURL(blob);

  new OBJLoader().load(
    objUrl,
    object => {
      URL.revokeObjectURL(objUrl);

      // Запрос устарел (пользователь переключился на другой режим)
      if (_sceneGeneration !== gen) return;

      // Накладываем текстуру персонажа если есть, иначе нейтральный силуэт
      if (modelTexDataUrl) {
        _applyModelTexture(object, modelTexDataUrl);
      } else {
        object.traverse(child => {
          if (!child.isMesh) return;
          child.material = new THREE.MeshLambertMaterial({ color: 0x575750, side: THREE.DoubleSide });
          child.material.needsUpdate = true;
        });
      }

      scene.add(object);
      currentModel = object;
      _revealCanvas();

      // Позиционируем и масштабируем так же как обычную модель
      object.position.set(-cx * scale, -cy * scale, -cz * scale);
      object.scale.setScalar(scale);

      // Камера (аналогично процедурному солдату)
      const fovRad   = (camera.fov * Math.PI) / 180;
      const distance = 1.0 / Math.tan(fovRad / 2) * 2.5;
      camera.position.set(0, 0.4, distance);
      camera.lookAt(0, 0.35, 0);
      controls.target.set(0, 0.35, 0);
      controls.update();

      // Billboard: последняя ЗАПРОШЕННАЯ текстура (могла смениться за время
      // парсинга OBJ через updateCritHitTexture), а не захваченная при старте
      _placeCritSprite(_lastCritTexUrl, 1.0);

      hideStatus();
        },
    undefined,
    err => {
      URL.revokeObjectURL(objUrl);
      console.error('Custom model OBJ load error:', err);
      // Fallback: строим процедурного солдата (только если запрос ещё актуален)
      if (_sceneGeneration === gen) {
        window.loadCritHitScene(_lastCritTexUrl, modelTexDataUrl);
      }
    }
  );
};


// Публичная функция: обновляет только текстуру CritHIT billboard.
// Билборд крита над УЖЕ показанной анимированной сценой
//
// Сцену смерти строит общий loadViewmodelAnimated (персонаж, скелет, дорожки),
// и спрайт к ней добавляется отдельно: он есть только у крита. Флаг режима
// поднимаем здесь же - по нему работает updateCritHitTexture, когда человек
// меняет картинку
window.setCritSprite = function(critTexDataUrl) {
  _isCritHitMode  = true;
  _lastCritTexUrl = critTexDataUrl || '';
  // Сцена вписана в две единицы вокруг нуля (TARGET_EXTENT), значит её верх -
  // ровно единица. Тело лежит, поэтому «над головой» здесь - над сценой
  _placeCritSprite(_lastCritTexUrl, 1.0);
};

window.updateCritHitTexture = function(critTexDataUrl) {
  if (!_isCritHitMode) return;
  _lastCritTexUrl = critTexDataUrl || '';
  const solHeight    = 88;
  const headTopWorld = (solHeight - solHeight / 2) * (2.0 / solHeight); // 1.0
  _placeCritSprite(_lastCritTexUrl, headTopWorld);
};

// Drag & Drop (текстура прямо в 3D)
const IMAGE_EXTS = /\.(png|jpg|jpeg|bmp|gif|webp|tga)$/i;
let   _dragDepth = 0;

// Per-mesh raycasting
const _raycaster    = new THREE.Raycaster();
const _dropNDC      = new THREE.Vector2();   // NDC-координаты в момент drop
let   _dragHoverMesh    = null;              // меш, подсвеченный при наведении
let   _dragHoverOrigMat = null;              // его оригинальный материал

function _ndcFromEvent(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width)  * 2 - 1,
    -((e.clientY - rect.top)  / rect.height) * 2 + 1
  );
}

function _hitMeshAt(ndc) {
  const hits = _hitsAt(ndc);
  return hits.length > 0 ? hits[0].object : null;
}

// Ближайший меш, который пользователю РАЗРЕШЕНО перекрашивать
//
// Нередактируемые пропускаются насквозь: в сцене вида от первого лица рядом с
// оружием стоят чужие руки, и дроп на них красил именно их - как и подсветка,
// которая это обещала. Инспектору материалов, наоборот, нужен любой меш,
// поэтому фильтр живёт здесь, а не в _hitMeshAt
function _hitEditableMeshAt(ndc) {
  return _firstEditableHit(_hitsAt(ndc), _editableMeshNames);
}

function _hitsAt(ndc) {
  if (!currentModel || _isCritHitMode) return [];
  _raycaster.setFromCamera(ndc, camera);
  // Луч three.js не пропускает спрятанное: призрак оригинала своей модели
  // висит в сцене и вне подгонки, и щелчок по нему отдавал номера ЕГО
  // треугольников как номера модели - ножницы резали не то
  return _raycaster.intersectObject(currentModel, true).filter(h => _shown(h.object));
}

function _shown(obj) {
  for (let o = obj; o; o = o.parent) if (!o.visible) return false;
  return true;
}

// Подсвечивает меш при перетаскивании над ним
function _setDragHover(mesh) {
  if (_dragHoverMesh === mesh) return;
  _clearDragHover();
  if (!mesh || Array.isArray(mesh.material)) return;
  _dragHoverMesh    = mesh;
  _dragHoverOrigMat = mesh.material;
  const hl = mesh.material.clone();
  hl.emissive          = new THREE.Color(0.35, 0.25, 0.0);
  hl.emissiveIntensity = 1;
  mesh.material        = hl;
  mesh.material.needsUpdate = true;
}

// Снимает подсветку
function _clearDragHover() {
  if (_dragHoverMesh && _dragHoverOrigMat) {
    _dragHoverMesh.material = _dragHoverOrigMat;
    _dragHoverMesh.material.needsUpdate = true;
  }
  _dragHoverMesh    = null;
  _dragHoverOrigMat = null;
}

document.addEventListener('dragenter', e => {
  const items = e.dataTransfer?.items;
  if (!items) return;
  const hasImage = Array.from(items).some(
    item => item.kind === 'file' && (item.type.startsWith('image/') || IMAGE_EXTS.test(item.name || ''))
  );
  if (!hasImage) return;
  e.preventDefault();
  _dragDepth++;
  if (_dragDepth === 1) dropOverlay.classList.add('visible');
  // Разбор модели на части считает Python. Просим его при первом же
  // перетаскивании: до него это никому не нужно, а ждать кнопки - значит
  // потерять единственный момент, когда подсветка что-то объясняет
  if (!_partsMap && typeof window.onPartsNeeded === 'function') {
    window.onPartsNeeded();
  }
});

document.addEventListener('dragleave', () => {
  _dragDepth = Math.max(0, _dragDepth - 1);
  if (_dragDepth === 0) window.endDrag();
});

// Перетаскивание ушло из кадра. Сам кадр узнаёт об этом по dragleave, но
// когда курсор быстро уходит из iframe на страницу, Chromium его не всегда
// присылает - а бросок достаётся уже странице (карточке текстуры), и до
// вьювера не доходит. Подсказка «Отпустите…» тогда висела над моделью до
// следующего перетаскивания. Поэтому страница зовёт это сама, как только
// перетаскивание идёт над ней
window.endDrag = function () {
  if (_dragDepth === 0 && !dropOverlay.classList.contains('visible')) return;
  _dragDepth = 0;
  dropOverlay.classList.remove('visible');
  _clearDragHover();
  if (!_partsMode) _clearPartHover();
};

// Подсвечиваем КУСОК под курсором, если части уже разобраны: обещать подсветкой
// целый меш там, где картинка ляжет на одну часть, - врать про результат
function _hoverDrag(ndc) {
  if (_dragDepth <= 0) return;
  const overPart = _partsMap ? _partAt(ndc) : null;
  if (overPart) { _clearDragHover(); _setPartHover(overPart); }
  else if (!_partsMode) _setDragHover(_hitEditableMeshAt(ndc));
}

document.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  if (_dragDepth <= 0) return;
  _queueHover(e, _hoverDrag);
});

document.addEventListener('drop', e => {
  e.preventDefault();
  dropOverlay.classList.remove('visible');

  // Фиксируем целевую часть/меш ДО асинхронного чтения файла и ДО сброса
  // счётчика перетаскивания: по нему части работают без включённого режима
  const hitPart = _partAt(_ndcFromEvent(e));
  const hitMesh = _hitEditableMeshAt(_ndcFromEvent(e));
  _dragDepth = 0;
  _clearPartHover();
  _clearDragHover();

  const file = e.dataTransfer?.files?.[0];
  if (!file) return;
  const isImage = file.type.startsWith('image/') || IMAGE_EXTS.test(file.name);
  if (!isImage) return;

  // Режим частей: картинку в текстуру вклеивает Python - вьювер только
  // говорит, на какой кусок её принесли. Сам он этого сделать не может: у
  // всей модели один материал и одна текстура
  if (hitPart && typeof window.onPartDropped === 'function') {
    _endIsolation();            // картинка ляжет на живую модель
    window.onPartDropped(hitPart.material, hitPart.part, file);
    return;
  }

  // Остальное - текстура материала. Кладёт её страница: она решает, на какую
  // карточку (команда, стиль), и присылает картинку обратно в кадр. Положи
  // вьювер её сам, модель показала бы то, чего нет в сборке
  if (typeof window.onTextureDropped === 'function') {
    const name = hitMesh
      ? (Array.isArray(hitMesh.material) ? hitMesh.name : (hitMesh.material.name || hitMesh.name))
      : '';
    window.onTextureDropped(name, file);
  }
});

// Части модели: подсветка куска под курсором
//
// Материал у оружия почти всегда один, поэтому «покрасить только ствол» - это
// не второй материал, а кусок геометрии. Хозяин разбиения - Python (он же
// потом вклеивает картинку в развёртку), сюда приезжает готовая карта «номер
// треугольника -> номер части», и по ней подсвечивается то, во что попала мышь
let _partsMap  = null;   // {материал: [номер части для каждого треугольника]}
let _partsMode = false;
let _partHover = null;   // {mesh, material, part, overlay}

window.setModelParts = function(map) {
  _partsMap = (map && Object.keys(map).length) ? map : null;
  _clearPartHover();
  _endIsolation();              // номера частей у новой карты другие
  // Новая модель - номера треугольников чужие, выделение с них снять
  if (!_partsMap) window.clearCutSelection();
};

window.setPartsMode = function(on) {
  _partsMode = !!on;
  // Класс `inspecting` (знак вопроса) здесь не ставится: он принадлежит
  // инспектору материалов и обещает справку. Чем работают, показывает курсор
  // инструмента - см. setPartsTool
  if (!_partsMode) { _clearPartHover(); _endIsolation(); window.setPartsTool(''); }
};

// Свои материалы частей
//
// Часть, отданная в свой материал, в игре - отдельный материал модели. Здесь
// меш делится так же: остаток под прежним именем и по куску на материал под
// его именем. Дальше раздача текстур, подсказки и выбор мешем работают по
// имени, как с любым другим материалом. Номера треугольников у кусков свои:
// всё, что работает по номерам (части, ножницы), переводит попадание по
// куску на исходный меш (`split.from`, `split.faces`) - он спрятан, но цел
let _partMats = {};   // {материал: {total, parts: [{name, runs: [[начало, сколько]…]}]}}
let _texByName = {};  // последняя текстура, положенная по имени материала (applyMaterialMap)

window.setPartMaterials = function(map) {
  const next = map || {};
  if (JSON.stringify(next) === JSON.stringify(_partMats)) return;
  _partMats = next;
  _matHints = _withPartHints(_rawHints);
  _splitParts();
};

// Материал части рисуется как исходный: подсказки приходят по именам игровых
// материалов, а у части имени в игре нет, VMT же она наследует
function _withPartHints(hints) {
  const out = { ...hints };
  for (const [base, spec] of Object.entries(_partMats)) {
    for (const p of spec.parts) if (!out[p.name] && out[base]) out[p.name] = out[base];
  }
  return out;
}

/** Для автопроверки: меши предмета - имя, материал, виден ли, откуда
 *  текстура (адрес картинки), треугольников */
window.partMaterialsDebug = () => {
  const out = [];
  if (currentModel) currentModel.traverse(c => {
    const map = (c.material || {}).map;
    if (c.isMesh) out.push({ name: c.name, material: (c.material || {}).name || '',
                             visible: c.visible, map: map ? ((map.image || {}).src || '?') : '',
                             tris: c.geometry.attributes.position.count / 3 });
  });
  return out;
};

function _unsplitParts() {
  if (!currentModel) return;
  const pieces = [];
  currentModel.traverse(c => {
    if (c.userData.partSplit) pieces.push(c);
    else if (c.userData.splitHidden) { c.visible = true; delete c.userData.splitHidden; }
  });
  pieces.forEach(c => { c.removeFromParent(); c.geometry.dispose(); });
}

function _splitParts() {
  _unsplitParts();
  if (!currentModel || !Object.keys(_partMats).length) return;
  const meshes = [];
  currentModel.traverse(c => {
    if (!c.isMesh || c.isSkinnedMesh || !c.material || Array.isArray(c.material)) return;
    if (_partMats[c.material.name || c.name]) meshes.push(c);
  });
  meshes.forEach(_splitMesh);
}

function _splitMesh(mesh) {
  const name = mesh.material.name || mesh.name;
  const spec = _partMats[name];
  const geo = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry;
  const attrs = Object.entries(geo.attributes);
  const total = geo.attributes.position.count / 3;
  // Другая сцена (руки, персонаж на шапке) - номера не про этот меш
  if (total !== spec.total || attrs.some(([, a]) => a.isInterleavedBufferAttribute)) return;
  const owner = new Int32Array(total);   // 0 - остаток, k - k-й материал
  spec.parts.forEach((p, k) => p.runs.forEach(([a, n]) => owner.fill(k + 1, a, a + n)));
  [name, ...spec.parts.map(p => p.name)].forEach((pieceName, slot) => {
    const faces = [];
    for (let t = 0; t < total; t++) if (owner[t] === slot) faces.push(t);
    if (!faces.length) return;
    const g = new THREE.BufferGeometry();
    for (const [key, a] of attrs) {
      const step = 3 * a.itemSize;
      const out = new a.array.constructor(faces.length * step);
      faces.forEach((t, i) => out.set(a.array.subarray(t * step, (t + 1) * step), i * step));
      g.setAttribute(key, new THREE.BufferAttribute(out, a.itemSize, a.normalized));
    }
    // Кусок пересоздаётся при каждой смене материалов: своя текстура у него
    // - последняя, положенная на его имя
    const map = (slot && _texByName[pieceName]) || mesh.material.map;
    const piece = new THREE.Mesh(g, makeMeshMaterial({ map, name: pieceName }));
    piece.name = slot ? pieceName : mesh.name;
    piece.position.copy(mesh.position);
    piece.quaternion.copy(mesh.quaternion);
    piece.scale.copy(mesh.scale);
    piece.renderOrder = mesh.renderOrder;
    piece.userData.partSplit = { from: mesh, faces: Int32Array.from(faces) };
    mesh.parent.add(piece);
  });
  if (geo !== mesh.geometry) geo.dispose();
  mesh.visible = false;
  mesh.userData.splitHidden = true;
}

// Инструмент частей: курсор и пипетка
//
// Вьювер про инструменты ничего не решает - он получает готовое значение CSS
// (рисунки значков живут на странице, второй их копии здесь быть не должно) и
// одно имя, потому что от имени зависит ответ на щелчок
let _partsTool = '';

window.setPartsTool = function(name, cursor) {
  _partsTool = name || '';
  document.getElementById('canvas-container').style.cursor = cursor || '';
  // Подсветка куска закрашивает ровно то, с чего пипетка берёт цвет: под
  // оранжевой плёнкой не видно, во что целятся, и взятый цвет оказывался
  // неожиданным. Поэтому при пипетке её нет вовсе - ни в 3D, ни разметкой на
  // кадре (её рисует страница по onPartHover, а его теперь не будет)
  if (_partsTool === 'pick') _clearPartHover();
};

/**
 * Цвет ТЕКСТУРЫ под курсором - «#rrggbb» или пустая строка
 *
 * Из текстуры, а не с экрана: на экране цвет уже перемешан со светом и тенью,
 * и взятая с него краска на модели выходит темнее выбранной. Заодно ответ
 * совпадает с пипеткой по кадру на странице - она берёт из той же картинки.
 */
function _texelAt(ndc) {
  const hit = _hitsAt(ndc)[0];
  if (!hit || !hit.uv) return '';
  const mat = hit.object.material;
  const img = (mat && !Array.isArray(mat) && mat.map) ? mat.map.image : null;
  const w = img && (img.naturalWidth || img.width);
  const h = img && (img.naturalHeight || img.height);
  if (!w || !h) return '';
  // Развёртка выходит за 0..1 (wrapS/wrapT = Repeat) - берём ту же клетку,
  // которую показывает игра
  const frac = (v) => v - Math.floor(v);
  // flipY у текстур three.js включён по умолчанию: v = 0 - это НИЗ картинки
  const x = Math.min(w - 1, Math.floor(frac(hit.uv.x) * w));
  const y = Math.min(h - 1, Math.floor((1 - frac(hit.uv.y)) * h));
  try {
    const cell = document.createElement('canvas');
    cell.width = 1;
    cell.height = 1;
    const ctx = cell.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, x, y, 1, 1, 0, 0, 1, 1);
    const px = ctx.getImageData(0, 0, 1, 1).data;
    return '#' + [px[0], px[1], px[2]]
      .map(v => v.toString(16).padStart(2, '0')).join('');
  } catch (err) {
    // Картинка с чужого адреса закрывает канвас на чтение: у нас все свои, но
    // молча отдать чёрный цвет хуже, чем не отдать ничего
    console.warn('[3D viewer] пипетка: не прочитать текстуру:', err);
    return '';
  }
}

// Номера частей для меша. Имя материала - единственная связь с разбором из
// Python; у одноматериальной модели связывать нечего, берём единственный набор
function _listFrom(map, mesh) {
  if (!map || !mesh) return null;
  const name = (mesh.material && !Array.isArray(mesh.material) && mesh.material.name)
    || mesh.name || '';
  if (map[name]) return map[name];
  // Призрак оригинала - не часть предмета: своих частей у него нет, а чужая
  // карта дала бы его треугольникам номера модели
  if (String(name).startsWith('ghost:')) return null;
  // Единственная карта предмета годится любому его мешу (у одноматериальной
  // модели она лежит под служебным ключом). Гирлянда в счёт не идёт: у неё
  // свои карты под именами мешей, и чужую ей подставлять нельзя.
  // Меш гирлянды - только своя карта: у её материалов разборы разные
  if (_isDecorName(name)) return null;
  const own = Object.keys(map).filter(k => !_isDecorName(k));
  return own.length === 1 ? map[own[0]] : null;
}

function _partListFor(mesh) { return _listFrom(_partsMap, mesh); }

function _partAt(ndc) {
  // Во время перетаскивания части работают и без включённого режима: человек
  // тащит картинку на ствол, а не «сначала жмёт кнопку»
  if (!_partsMode && _dragDepth <= 0) return null;
  const hit = _hitsAt(ndc)[0];
  if (!hit || hit.faceIndex == null) return null;
  // Кусок своего материала: номера частей - от исходного меша (см. _splitMesh)
  const split = hit.object.userData.partSplit;
  const mesh = split ? split.from : hit.object;
  const face = split ? split.faces[hit.faceIndex] : hit.faceIndex;
  const list = _listFrom(_partsMap, mesh);
  if (!list) return null;
  const part = list[face];
  if (part == null) return null;
  const parts = _partListFor(mesh);
  return { mesh, part, list,
           owner: parts ? parts[face] : null,
           material: (mesh.material || {}).name || '' };
}

// Подсветка - отдельный полупрозрачный меш из треугольников части, а не
// подмена материала: материал у всей модели общий, и подменять его значило бы
// подсветить модель целиком
function _partOverlay(mesh, list, part) {
  const tris = [];
  for (let tri = 0; tri < list.length; tri++) if (list[tri] === part) tris.push(tri);
  return _trisOverlay(mesh, tris, 0xffb347, 0.55);
}

// Подсветка набора треугольников: наведение на часть, что возьмут ножницы,
// выделение ножниц. Цвет - по смыслу: оранжевый «сюда», голубой «выделено»
function _trisOverlay(mesh, tris, color, opacity) {
  const src = mesh.geometry.attributes.position;
  const index = mesh.geometry.index;
  const keep = [];
  for (const tri of tris) {
    for (let corner = 0; corner < 3; corner++) {
      const v = index ? index.getX(tri * 3 + corner) : tri * 3 + corner;
      keep.push(src.getX(v), src.getY(v), src.getZ(v));
    }
  }
  if (!keep.length) return null;

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position',
    new THREE.BufferAttribute(new Float32Array(keep), 3));
  // Подсветка лежит РОВНО на треугольниках части, то есть копланарна модели.
  // Со сдвигом только по фактору (-2, units 0) она выигрывала глубину не
  // везде: у шпиона от подсветки тела оставались пятна на кистях и полоски
  // по бокам ног - остальное съедал z-fighting. Сдвиг по обоим слагаемым
  // убирает это, а перекрытие остаётся честным: часть с обратной стороны
  // модели сквозь неё не светит
  const overlay = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    // С ОБЕИХ сторон: у одежды часть треугольников намотана «изнанкой»
    // наружу, сама модель их показывает (её материал двусторонний), а
    // односторонняя подсветка их отбрасывала - у шпиона от подсветки тела
    // оставались кисти и полоски по ногам, а пиджак не подсвечивался вовсе
    side: THREE.DoubleSide,
    depthWrite: false, polygonOffset: true,
    polygonOffsetFactor: -4, polygonOffsetUnits: -8,
  }));
  overlay.renderOrder = 999;
  // Луч сквозь подсветку проходит насквозь. Она лежит РОВНО на треугольниках
  // части, и без этого попадала бы в пересечения наравне с самой моделью: её
  // faceIndex - номер в её собственной геометрии, и часть по нему выходила бы
  // чужая. Заодно это снимает половину работы луча в режиме частей
  overlay.raycast = () => {};
  if (mesh.userData.splitHidden) {
    // Меш спрятан за кусками своих материалов: в нём подсветку не видно
    overlay.position.copy(mesh.position);
    overlay.quaternion.copy(mesh.quaternion);
    overlay.scale.copy(mesh.scale);
    mesh.parent.add(overlay);
  } else {
    mesh.add(overlay);          // геометрия в локальных координатах меша
  }
  return overlay;
}

// Меш, для которого у нас есть разбор на части. Ищем обходом сцены: имя
// материала - единственная связь с разбором, а мешей в кадре бывает несколько
//
// Имя материала обязательно, когда их несколько: у шпиона голова и тело - это
// РАЗНЫЕ материалы со своими развёртками, и «первый попавшийся меш с картой»
// подсвечивал голову там, где страница просила часть тела
function _meshWithParts(material) {
  let named = null;
  let any = null;
  if (currentModel) {
    currentModel.traverse(obj => {
      // Куски своих материалов - не по номерам частей: подсветка строится по
      // исходному мешу (он спрятан, но цел)
      if (!obj.isMesh || obj.userData.partSplit || !_partListFor(obj)) return;
      const name = (obj.material || {}).name || '';
      // «Любой» - только меш предмета: карта одноматериальной модели лежит
      // под служебным ключом и гирлянде не подходит
      if (!any && !_isDecorName(name)) any = obj;
      if (!named && material && name === material) named = obj;
    });
  }
  // Без совпадения по имени - первый меш с картой: у одноматериальной модели
  // карта лежит под служебным ключом, и материал ей не назвать
  return named || any;
}

// Подсветка части по номеру - для наведения на список частей на странице
window.highlightPart = function(part, material) {
  const mesh = (part === null || part === undefined)
    ? null : _meshWithParts(material);
  if (!mesh) { _clearPartHover(); return; }
  _setPartHover({ mesh, part,
                  material: (mesh.material || {}).name || '' });
};

// Одна часть на виду (Ctrl+щелчок)
//
// Чтобы понять, за что отвечает часть: она остаётся как есть, остальная модель
// становится полупрозрачной. Меш с частью не рисуется (материал visible=false,
// луч его по-прежнему ловит - Ctrl+щелчок по соседней части работает), вместо
// него две копии его треугольников: часть - с клоном его материала (шейдеры
// здесь не патчатся, клон выглядит так же), остаток - с полупрозрачным. Прочие
// меши гаснут на время, флаги всех материалов возвращаются как были. Только
// просмотр: копии статичны, поэтому покраска и новая карта частей режим снимают
let _isolated = null;   // {mesh, part, copies, faded: [[материал, флаги]], mats}
const _FADE = 0.3;

window.isolatePart = function(part, material) {
  const mesh = (part === null || part === undefined) ? null : _meshWithParts(material);
  const same = _isolated && mesh && _isolated.mesh === mesh && _isolated.part === part;
  _clearIsolation();
  if (!mesh || same) { _tellIsolated(null, ''); return; }
  const list = _partListFor(mesh);
  const own = [], rest = [];
  for (let tri = 0; tri < list.length; tri++) (list[tri] === part ? own : rest).push(tri);
  if (!own.length) { _tellIsolated(null, ''); return; }
  // ponytail: у меша с группами материалов часть берёт материал первой группы
  const base = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
  const solid = base.clone();
  const ghost = base.clone();
  Object.assign(ghost, _ghostLook(_FADE));
  const copies = [_trisCopy(mesh, own, solid), _trisCopy(mesh, rest, ghost)].filter(Boolean);
  const faded = [];
  const keep = (m, change) => {
    if (faded.some(([x]) => x === m)) return;
    faded.push([m, { transparent: m.transparent, opacity: m.opacity,
                     depthWrite: m.depthWrite, visible: m.visible,
                     onBeforeCompile: m.onBeforeCompile }]);
    Object.assign(m, change);
    m.needsUpdate = true;
  };
  for (const m of [].concat(mesh.material || [])) keep(m, { visible: false });
  currentModel.traverse(obj => {
    if (!obj.isMesh || obj === mesh || copies.includes(obj) || !_shown(obj)) return;
    for (const m of [].concat(obj.material || [])) keep(m, _ghostLook(m.opacity * _FADE));
  });
  _isolated = { mesh, part, copies, faded, mats: [solid, ghost] };
  _tellIsolated(part, (base || {}).name || '');
};

function _clearIsolation() {
  if (!_isolated) return;
  const { copies, faded, mats } = _isolated;
  _isolated = null;
  for (const copy of copies) { copy.removeFromParent(); copy.geometry.dispose(); }
  for (const m of mats) m.dispose();
  for (const [m, flags] of faded) { Object.assign(m, flags); m.needsUpdate = true; }
}

// Полупрозрачность без альфы текстуры: у VTF альфа - маска бликов ($phong),
// и прозрачность по ней гасила металл почти целиком. Альфа = только opacity
function _ghostAlpha(shader) {
  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <map_fragment>', '#include <map_fragment>\n\tdiffuseColor.a = opacity;');
}

function _ghostLook(opacity) {
  return { transparent: true, opacity, depthWrite: false, onBeforeCompile: _ghostAlpha };
}

/** Снять показ одной части и сказать странице - если он был */
function _endIsolation() {
  if (!_isolated) return;
  _clearIsolation();
  _tellIsolated(null, '');
}

function _tellIsolated(part, material) {
  if (typeof window.onPartIsolated === 'function') window.onPartIsolated(part, material);
}

// Копия треугольников меша со всеми атрибутами (позиция, нормаль, UV…) под
// заданным материалом - рядом с мешем и в его координатах
function _trisCopy(mesh, tris, material) {
  if (!tris.length) return null;
  const src = mesh.geometry, index = src.index;
  const geometry = new THREE.BufferGeometry();
  const getters = ['getX', 'getY', 'getZ', 'getW'];
  for (const [name, attr] of Object.entries(src.attributes)) {
    if (name === 'skinIndex' || name === 'skinWeight') continue;
    const size = attr.itemSize;
    const out = new Float32Array(tris.length * 3 * size);
    let k = 0;
    for (const tri of tris) {
      for (let corner = 0; corner < 3; corner++) {
        const v = index ? index.getX(tri * 3 + corner) : tri * 3 + corner;
        for (let i = 0; i < size; i++) out[k++] = attr[getters[i]](v);
      }
    }
    geometry.setAttribute(name, new THREE.BufferAttribute(out, size, attr.normalized));
  }
  const copy = new THREE.Mesh(geometry, material);
  copy.raycast = () => {};
  copy.position.copy(mesh.position);
  copy.quaternion.copy(mesh.quaternion);
  copy.scale.copy(mesh.scale);
  copy.renderOrder = material.transparent ? 1 : 0;
  mesh.parent.add(copy);
  return copy;
}

function _setPartHover(found) {
  if (_partHover && found && _partHover.mesh === found.mesh
      && _partHover.part === found.part) return;
  _clearPartHover();
  // О наведении сообщаем наружу вместе с ИМЕНЕМ МАТЕРИАЛА: у модели их
  // бывает несколько (у шпиона голова и тело), развёртка у каждого своя, и без
  // имени страница рисовала разметку на первой попавшейся текстуре
  if (typeof window.onPartHover === 'function') {
    window.onPartHover(found ? found.part : null,
                       found ? found.material : '');
  }
  if (!found) return;
  const list = found.list || _partListFor(found.mesh);
  const overlay = list ? _partOverlay(found.mesh, list, found.part) : null;
  if (overlay) _partHover = { ...found, overlay };
}

function _clearPartHover() {
  if (_partHover && _partHover.overlay) _dropOverlay(_partHover.overlay);
  _partHover = null;
}

function _dropOverlay(overlay) {
  if (!overlay) return;
  overlay.removeFromParent();
  overlay.geometry.dispose();
  overlay.material.dispose();
}

// Наведение считаем не чаще раза в кадр. mousemove и dragover приходят сотнями
// в секунду, а каждый ответ - это луч через всю геометрию плюс
// getBoundingClientRect, то есть принудительный пересчёт раскладки. Подсветке
// кадра достаточно: чаще её всё равно не видно
let _hoverPos = null;   // положение курсора из последнего события
let _hoverAct = null;   // что сделать с ним в начале кадра
function _queueHover(e, act) {
  _hoverPos = { clientX: e.clientX, clientY: e.clientY };
  const queued = _hoverAct !== null;
  _hoverAct = act;
  if (queued) return;
  requestAnimationFrame(() => {
    const run = _hoverAct;
    _hoverAct = null;
    run(_ndcFromEvent(_hoverPos));
    requestRender();
  });
}

function _hoverParts(ndc) {
  // Пока берут цвет, подсветки нет: она закрашивает ровно тот пиксель, на
  // который целятся. Это и выбранная пипетка, и Alt при кисти - там подсветка
  // успела бы мигнуть на время протяжки
  if (_partsMode && _cutMode) { _hoverCut(ndc); return; }
  if (_partsMode && _partsTool !== 'pick' && !_pickDrag) {
    _setPartHover(_partAt(ndc));
  }
}

renderer.domElement.addEventListener('mousemove', e => {
  if (_partsMode) _queueHover(e, _hoverParts);
});

// Клик по части. Вращение камеры - тоже зажатая кнопка, поэтому выбором
// считаем только клик без протяжки
let _partDownAt = null;
renderer.domElement.addEventListener('pointerdown', e => {
  _partDownAt = _partsMode ? { x: e.clientX, y: e.clientY } : null;
});
renderer.domElement.addEventListener('pointerup', e => {
  const down = _partDownAt;
  _partDownAt = null;
  if (!_partsMode || !down) return;
  if (Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 4) return;
  // В режиме резки щелчок режет, а не красит: два ответа на один щелчок -
  // это и есть та неоднозначность, из-за которой человек вместо разреза
  // получал окно выбора текстуры
  if (_cutMode) { if (_cutTool !== 'brush') _cutClick(e); return; }
  const found = _partAt(_ndcFromEvent(e));
  // Ctrl+щелчок - посмотреть часть отдельно, а не красить
  if (e.ctrlKey || e.metaKey) {
    if (found) window.isolatePart(found.part, found.material);
    return;
  }
  _endIsolation();              // красят живую модель, а не копию части
  if (found && typeof window.onPartPicked === 'function') {
    window.onPartPicked(found.material, found.part);
  }
});

/**
 * Пипетка: цвет видно, пока кнопку держат, и он берётся там, где отпустили
 *
 * Так это работает в редакторах изображений, и иначе не получается вовсе:
 * попасть в нужный пиксель модели с первого щелчка нельзя - её крутят и
 * приближают, и один пиксель текстуры бывает меньше точки экрана
 *
 * Слушаем на КОНТЕЙНЕРЕ и в фазе перехвата, а событие дальше не пускаем: под
 * ним и OrbitControls (иначе протяжка пипеткой крутила бы камеру), и выбор
 * части (иначе тот же щелчок ещё и красил бы). Гасить `controls.enabled` для
 * этого нельзя: выключённый OrbitControls не убирает у себя отпущенный
 * указатель, и следующая протяжка после пипетки считалась бы вторым пальцем
 *
 * Alt при кисти делает то же самое «на минуту» - как в редакторах
 * изображений. Смотрим на сам щелчок, а не на нажатие клавиши: Alt приходит в
 * тот документ, у которого фокус, а курсор ходит между страницей и вьювером
 * независимо от него.
 */
let _pickDrag = false;

//: Берут ли этим щелчком цвет. Решает НАЧАЛО протяжки: Alt, отпущенный по
//: дороге, её не обрывает - рука уже ведёт пипетку
function _sampling(e) {
  return _partsMode
    && (_partsTool === 'pick' || (e.altKey && _partsTool === 'brush'));
}

function _tellSample(hex, e) {
  if (typeof window.onColorSample === 'function') {
    window.onColorSample(hex, e ? e.clientX : 0, e ? e.clientY : 0);
  }
}

(function bindPickDrag() {
  const box = document.getElementById('canvas-container');

  box.addEventListener('pointerdown', e => {
    if (!_sampling(e)) return;
    e.stopPropagation();
    e.preventDefault();
    _pickDrag = true;
    box.setPointerCapture(e.pointerId);
    _clearPartHover();     // подсветка от кисти закрыла бы то, с чего берут цвет
    _tellSample(_texelAt(_ndcFromEvent(e)), e);
  }, true);

  box.addEventListener('pointermove', e => {
    if (!_pickDrag) return;
    e.stopPropagation();
    _tellSample(_texelAt(_ndcFromEvent(e)), e);
  }, true);

  const finish = (e, take) => {
    if (!_pickDrag) return;
    e.stopPropagation();
    _pickDrag = false;
    if (box.hasPointerCapture(e.pointerId)) box.releasePointerCapture(e.pointerId);
    const hex = take ? _texelAt(_ndcFromEvent(e)) : '';
    _tellSample('', null);
    if (hex && typeof window.onColorPicked === 'function') window.onColorPicked(hex);
  };

  box.addEventListener('pointerup', e => finish(e, true), true);
  box.addEventListener('pointercancel', e => finish(e, false), true);
})();

// Клавиши отмены принадлежат СТРАНИЦЕ, а фокус после щелчка по модели
// достаётся iframe - и Ctrl+Z, обещанный подсказкой режима частей, молча не
// работал, пока не щёлкнешь мимо кадра. Своей обработки не заводим: история
// покраски живёт на странице, здесь только передача нажатия
window.addEventListener('keydown', e => {
  // Ножницы: Enter отделяет выделенное, Esc сбрасывает - решает страница,
  // у неё кнопки и ответ Python
  if (_cutMode && (e.key === 'Enter' || e.key === 'Escape')
      && typeof window.onCutKey === 'function') {
    window.onCutKey(e.key);
    return;
  }
  if (e.key === 'Escape' && _isolated) { _endIsolation(); return; }
  if (!(e.ctrlKey || e.metaKey)) return;
  if (typeof window.onPartsKey === 'function') window.onPartsKey(e);
});

// Инспекция материала/текстуры (кнопка «?»)
const _inspectBtn    = document.getElementById('inspect-btn');
const _inspectTip    = document.getElementById('inspect-tip');
const _inspectTipImg = document.getElementById('inspect-tip-img');
const _inspectTipMat = document.getElementById('inspect-tip-mat');
let   _inspectMode   = false;
_inspectBtn.title = _t.inspect;

function _setInspectMode(on) {
  _inspectMode = on;
  _inspectBtn.classList.toggle('active', on);
  document.getElementById('canvas-container').classList.toggle('inspecting', on);
  if (!on) _inspectTip.style.display = 'none';
}

_inspectBtn.addEventListener('click', () => _setInspectMode(!_inspectMode));

// Непрозрачная миниатюра: у VTF альфа - маска бликов ($phong), а не прозрачность.
// На модели текстура и так рисуется непрозрачной, поэтому в превью форсим alpha=255.
// Кэш по исходному src + уменьшение до 128px, чтобы не тормозить на больших текстурах
const _opaqueThumbCache = new Map();
function _opaqueThumb(img) {
  const key = img.src || img.currentSrc || '';
  if (!key) return '';
  if (_opaqueThumbCache.has(key)) return _opaqueThumbCache.get(key);
  try {
    const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
    if (!sw || !sh) {
      console.warn('[inspect] opaqueThumb: zero size, tag=' + (img.tagName || typeof img));
      return key;
    }
    const sc = Math.min(1, 128 / Math.max(sw, sh));
    const w = Math.max(1, Math.round(sw * sc)), h = Math.max(1, Math.round(sh * sc));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h);
    const px = d.data;
    for (let i = 3; i < px.length; i += 4) px[i] = 255;  // alpha -> непрозрачно
    ctx.putImageData(d, 0, 0);
    const out = cv.toDataURL('image/png');
    _opaqueThumbCache.set(key, out);
    return out;
  } catch (err) {
    console.warn('[inspect] opaqueThumb FAIL: ' + (err && err.message ? err.message : err));
    return key;  // например, таинт-канвас - отдаём как есть
  }
}

// Имя материала + (непрозрачный) src текстуры под курсором
function _matInfoFromMesh(mesh) {
  if (!mesh || Array.isArray(mesh.material)) return null;
  const mat  = mesh.material;
  const name = (mat && mat.name) || mesh.name || '-';
  let src = '';
  const img = mat && mat.map && mat.map.image;
  if (img) src = _opaqueThumb(img) || img.src || img.currentSrc || '';
  return { name, src };
}

renderer.domElement.addEventListener('mousemove', e => {
  if (!_inspectMode) return;
  const info = _matInfoFromMesh(_hitMeshAt(_ndcFromEvent(e)));
  if (!info) { _inspectTip.style.display = 'none'; return; }

  _inspectTipMat.textContent = info.name;
  if (info.src) {
    _inspectTipImg.src = info.src;
    _inspectTipImg.classList.remove('empty');
  } else {
    _inspectTipImg.removeAttribute('src');
    _inspectTipImg.classList.add('empty');
  }

  // Позиционируем тултип у курсора, удерживая в пределах окна
  const pad = 14;
  _inspectTip.style.display = 'block';
  const tw = _inspectTip.offsetWidth, th = _inspectTip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + tw > window.innerWidth)  x = e.clientX - tw - pad;
  if (y + th > window.innerHeight) y = e.clientY - th - pad;
  _inspectTip.style.left = x + 'px';
  _inspectTip.style.top  = y + 'px';
});

renderer.domElement.addEventListener('mouseleave', () => {
  _inspectTip.style.display = 'none';
});

// Render loop
function animate() {
  requestAnimationFrame(animate);
  // Дельту снимаем КАЖДЫЙ кадр, даже без анимации: иначе после паузы
  // накопленное время прыгнет в микшер одним куском
  const delta = _animClock.getDelta();
  if (_skinned && _skinned.mixer) _skinned.mixer.update(delta);
  _updateSkinnedHidden(_skinned);
  // Флаги берём до шага: последний шаг перелёта их снимает, а кадр нужен
  const moving = !!(_camFly || _fitTween);
  const playing = !!(_skinned && _skinned.action && !_skinned.action.paused);
  _stepCameraFly();
  _stepFitTween();
  controls.update();
  // Кнопка инспекции доступна только когда есть обычная модель (не CritHIT)
  const _inspectAvail = !!currentModel && !_isCritHitMode;
  const _want = _inspectAvail ? 'flex' : 'none';
  if (_inspectBtn.style.display !== _want) _inspectBtn.style.display = _want;
  if (!_inspectAvail && _inspectMode) _setInspectMode(false);
  if (!(_renderQueued || moving || playing)) return;
  _renderQueued = false;
  renderer.render(scene, camera);
}
animate();

// Мышь и клавиши меняют сцену прямо в обработчиках (подсветка, резак,
// гизмо, изгиб), поэтому любой ввод просит кадр
for (const type of ['pointerdown', 'pointermove', 'pointerup', 'wheel', 'keydown',
                    'keyup', 'dragover', 'dragleave', 'drop']) {
  window.addEventListener(type, requestRender, { capture: true, passive: true });
}
// После сброса драйвера (бывает рядом с игрой) холст пуст до следующего кадра
renderer.domElement.addEventListener('webglcontextrestored', requestRender);

// Хост меняет сцену только через window.*: любой его вызов просит кадр.
// Опрос доли анимации идёт каждым кадром хоста и сцену не трогает
for (const name of Object.keys(window)) {
  const fn = window[name];
  if (_globalsBefore.has(name) || typeof fn !== 'function'
      || name === 'viewmodelProgress' || name.endsWith('Debug')) continue;
  window[name] = function(...args) { requestRender(); return fn.apply(this, args); };
}

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  requestRender();
});

// CDN error fallback
window.addEventListener('error', e => {
  if (e.filename && e.filename.includes('cdn.jsdelivr.net')) {
    setStatus(_t.no_internet, true);
  }
});
</script>
</body>
</html>
