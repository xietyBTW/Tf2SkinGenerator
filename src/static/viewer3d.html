// работал, пока не щёлкнешь мимо кадра. Своей обработки не заводим: история
// покраски живёт на странице, здесь только передача нажатия.
window.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  if (typeof window.onPartsKey === 'function') window.onPartsKey(e);
});

// ── Инспекция материала/текстуры (кнопка «?») ──────────────────────────────── //
const _inspectBtn    = document.getElementById('inspect-btn');
const _inspectTip    = document.getElementById('inspect-tip');
const _inspectTipImg = document.getElementById('inspect-tip-img');
const _inspectTipMat = document.getElementById('inspect-tip-mat');
let   _inspectMode   = false;
_inspectBtn.title = 'Инспектор материалов — наведи на модель';

function _setInspectMode(on) {
  _inspectMode = on;
  _inspectBtn.classList.toggle('active', on);
  document.getElementById('canvas-container').classList.toggle('inspecting', on);
  if (!on) _inspectTip.style.display = 'none';
}

_inspectBtn.addEventListener('click', () => _setInspectMode(!_inspectMode));

// Непрозрачная миниатюра: у VTF альфа — маска бликов ($phong), а не прозрачность.
// На модели текстура и так рисуется непрозрачной, поэтому в превью форсим alpha=255.
// Кэш по исходному src + уменьшение до 128px, чтобы не тормозить на больших текстурах.
const _opaqueThumbCache = new Map();
function _opaqueThumb(img) {
  const key = img.src || img.currentSrc || '';
  if (!key) return '';
  if (_opaqueThumbCache.has(key)) return _opaqueThumbCache.get(key);
  try {
    const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
    if (!sw || !sh) {
      console.warn('[inspect] opaqueThumb: zero size, tag=' + (img.tagName || typeof img));
      return key;
    }
    const sc = Math.min(1, 128 / Math.max(sw, sh));
    const w = Math.max(1, Math.round(sw * sc)), h = Math.max(1, Math.round(sh * sc));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h);
    const px = d.data;
    for (let i = 3; i < px.length; i += 4) px[i] = 255;  // alpha → непрозрачно
    ctx.putImageData(d, 0, 0);
    const out = cv.toDataURL('image/png');
    _opaqueThumbCache.set(key, out);
    return out;
  } catch (err) {
    console.warn('[inspect] opaqueThumb FAIL: ' + (err && err.message ? err.message : err));
    return key;  // например, таинт-канвас — отдаём как есть
  }
}

// Имя материала + (непрозрачный) src текстуры под курсором
function _matInfoFromMesh(mesh) {
  if (!mesh || Array.isArray(mesh.material)) return null;
  const mat  = mesh.material;
  const name = (mat && mat.name) || mesh.name || '—';
  let src = '';
  const img = mat && mat.map && mat.map.image;
  if (img) src = _opaqueThumb(img) || img.src || img.currentSrc || '';
  return { name, src };
}

renderer.domElement.addEventListener('mousemove', e => {
  if (!_inspectMode) return;
  const info = _matInfoFromMesh(_hitMeshAt(_ndcFromEvent(e)));
  if (!info) { _inspectTip.style.display = 'none'; return; }

  _inspectTipMat.textContent = info.name;
  if (info.src) {
    _inspectTipImg.src = info.src;
    _inspectTipImg.classList.remove('empty');
  } else {
    _inspectTipImg.removeAttribute('src');
    _inspectTipImg.classList.add('empty');
  }

  // Позиционируем тултип у курсора, удерживая в пределах окна
  const pad = 14;
  _inspectTip.style.display = 'block';
  const tw = _inspectTip.offsetWidth, th = _inspectTip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + tw > window.innerWidth)  x = e.clientX - tw - pad;
  if (y + th > window.innerHeight) y = e.clientY - th - pad;
  _inspectTip.style.left = x + 'px';
  _inspectTip.style.top  = y + 'px';
});

renderer.domElement.addEventListener('mouseleave', () => {
  _inspectTip.style.display = 'none';
});

// ── Render loop ──────────────────────────────────────────────────────────── //
function animate() {
  requestAnimationFrame(animate);
  // Дельту снимаем КАЖДЫЙ кадр, даже без анимации: иначе после паузы
  // накопленное время прыгнет в микшер одним куском.
  const delta = _animClock.getDelta();
  if (_skinned && _skinned.mixer) _skinned.mixer.update(delta);
  _updateSkinnedHidden(_skinned);
  controls.update();
  // Кнопка инспекции доступна только когда есть обычная модель (не CritHIT)
  const _inspectAvail = !!currentModel && !_isCritHitMode;
  const _want = _inspectAvail ? 'flex' : 'none';
  if (_inspectBtn.style.display !== _want) _inspectBtn.style.display = _want;
  if (!_inspectAvail && _inspectMode) _setInspectMode(false);
  renderer.render(scene, camera);
}
animate();

// ── Resize ───────────────────────────────────────────────────────────────── //
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── CDN error fallback ───────────────────────────────────────────────────── //
window.addEventListener('error', e => {
  if (e.filename && e.filename.includes('cdn.jsdelivr.net')) {
    setStatus(_t.no_internet, true);
  }
});
</script>
</body>
